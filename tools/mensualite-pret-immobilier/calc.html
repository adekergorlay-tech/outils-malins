<div class="row">
  <div>
    <label for="capital">Montant emprunté (€)</label>
    <input id="capital" type="text" inputmode="decimal" value="200000">
  </div>
  <div>
    <label for="duree">Durée (années)</label>
    <input id="duree" type="text" inputmode="numeric" value="20">
  </div>
</div>
<div class="row">
  <div>
    <label for="taux">Taux d'intérêt annuel (%)</label>
    <input id="taux" type="text" inputmode="decimal" value="3,3">
  </div>
  <div>
    <label for="assurance">Taux d'assurance annuel (%)</label>
    <input id="assurance" type="text" inputmode="decimal" value="0,30">
    <span class="hint">Appliqué au capital initial</span>
  </div>
</div>
<label for="revenus">Revenus nets mensuels du foyer (€, facultatif)</label>
<input id="revenus" type="text" inputmode="decimal" value="">
<div class="result">
  <div>Mensualité assurance comprise</div>
  <div class="big" id="r-mens">–</div>
  <table>
    <tr><td>Dont remboursement + intérêts</td><td id="r-hors">–</td></tr>
    <tr><td>Dont assurance</td><td id="r-ass">–</td></tr>
    <tr><td>Coût total des intérêts</td><td id="r-int">–</td></tr>
    <tr><td>Coût total de l'assurance</td><td id="r-ass-tot">–</td></tr>
    <tr><td>Taux d'endettement</td><td id="r-endet">–</td></tr>
  </table>
</div>
