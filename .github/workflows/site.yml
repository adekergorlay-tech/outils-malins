name: Générer et publier le site

on:
  push:
    branches: [main]
  schedule:
    # Lundi et jeudi à 6 h UTC : un nouvel outil est créé puis publié
    - cron: "0 6 * * 1,4"
  workflow_dispatch:
    inputs:
      count:
        description: "Nombre d'outils à créer maintenant (0 = publier seulement)"
        default: "1"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Créer un nouvel outil avec Gemini
        # Si Gemini échoue, le site est quand même republié
        continue-on-error: true
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.count != '0')
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          COUNT: ${{ inputs.count || '1' }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::warning::Secret GEMINI_API_KEY absent : aucun outil créé."
            exit 0
          fi
          python3 scripts/generate.py
          git config user.name "robot-calculs-malins"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools
          git diff --cached --quiet || git commit -m "Nouvel outil publié automatiquement"
          git push

      - name: Vérifier tous les calculateurs
        run: for d in tools/*/; do node scripts/check_tool.js "$d"; done

      - name: Construire le site
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io
          BASE_PATH: ${{ github.event.repository.name }}
        run: python3 scripts/build.py

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
